name: Deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
      - name: Create .env
        run: echo "${{ secrets.ENV_FILE }}" > .env
      - name: Build and restart
        run: |
          cd /home/ec2-user/butterApi
          docker stop butterapi-api-1 || true
          docker rm butterapi-api-1 || true
          docker-compose up -d --build
